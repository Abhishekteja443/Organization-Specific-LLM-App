<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Raider-GPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
            color: #2c3e50;
        }
        .header {
            background-color: #147446;
            color: white;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .login-card h2 {
            margin-bottom: 0.5rem;
            color: #147446;
            font-size: 1.9rem;
        }
        .login-card p {
            margin-bottom: 1.5rem;
            color: #535f6b;
        }
        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input {
            width: 100%;
            padding: 0.95rem 1rem;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: #147446;
            box-shadow: 0 0 0 3px rgba(20, 116, 70, 0.12);
        }
        .login-button {
            width: 100%;
            padding: 0.95rem 1rem;
            background-color: #147446;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .login-button:hover {
            background-color: #115f39;
        }
        .error {
            margin-bottom: 1rem;
            color: #c0392b;
            font-weight: 600;
        }
        .small-text {
            margin-top: 1.5rem;
            color: #7f8c8d;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="display: inline-block; vertical-align: middle;">Raider-GPT</h1>
        <img src="/static/raider mascot.png" alt="Raider Mascot" style="height: 80px; width: auto; margin-right: 1rem; vertical-align: middle;">
    </div>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Login to Raider-GPT</h2>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Username" value="{{ username|default('') }}" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
